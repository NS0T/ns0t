    <title>Page Not Found</title>
    <style>

        :root {
        --header-bg: rgba(20, 20, 22, 0.6);
        --header-border: rgba(255, 255, 255, 0.08);
        --header-text: #f4f4f5;
        --header-accent: #ffffff;
        --header-divider: rgba(255, 255, 255, 0.15);
        --header-width: 960px;
        --header-width-scrolled: 680px;

        --page-bg: #f3f1ed;
        --text-strong: #000000;
        --text-muted: #2f2f2f;
        --card-bg: #d9d9d9;
        --card-bg-alt: #e2e0db;
        --card-border: rgba(0, 0, 0, 0.07);
        --card-shadow-1: rgba(22, 20, 17, 0.08);
        --card-shadow-hover: rgba(22, 20, 17, 0.13);
        --card-inset: rgba(255, 255, 255, 0.46);
        --card-inset-hover: rgba(255, 255, 255, 0.52);
        --divider-color: #777;
        --bg-noise-line: rgba(0, 0, 0, 0.022);

        color-scheme: light;
        }

      body {
        font-family: sans-serif;
        padding: 50px;
      }

.error {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;

    position: absolute;
    top: 30%;
    left: 50%;
    transform: translateX(-50%);
}
      h1 {
        font-size: 50px;
        
      }
      p {
        font-size: 20px;
        color: #666;
      }
      img{
        max-width: 300px;
        height: auto;
        margin-bottom: 20px;
      }

      a{
        display: inline-block;
        padding: 10px 20px;
        color: #000000;
        background: var(--card-bg);
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <div class="error">
        <p>Oops, Something went wrong 😢</p>
        <img src="./assests/404.jpg" alt="404 Error" /> 
        <a href="index.html">Go back to the homepage</a>
    </div>
  </body>
