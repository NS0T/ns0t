<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Easter Egg</title>
    <style>
      html {
        background-color: #dee7de;
      }
      body {
        font-family: sans-serif;
        text-align: center;
      }
      .img-container {
        display: flex;
        justify-content: center;
        flex-direction: column;
        align-items: center;
        height: 100dvh;
        gap: 20px;
      }

      img {
        display: block;
        margin: 0 auto;
        width: 1000px;
      }

      a {
        display: inline-block;
        padding: 10px 20px;
        color: #ffffff;
        background: rgb(0, 0, 0);
        border-radius: 100px;
        text-decoration: none;
        font-weight: bold;
      }

      @media (max-width: 864px) {
        img {
          width: 700px;
        }
      }

      @media (max-width: 660px) {
        img {
          width: 600px;
        }
      }

      @media (max-width: 518px) {
        img {
          width: 400px;
        }
      }
    </style>
  </head>
  <body>
    <div class="img-container">
      <img src="assests/easteregg.gif" alt="Easter Egg" />
      <a href="index.html">LOL you got trolled real bad</a>
    </div>
  </body>
</html>
